name: h-line

services:
  h-line:
    build:
      context: .
      dockerfile: Dockerfile
    image: flet_h-line:${APP_VERSION}
    pull_policy: missing
    container_name: flet_h-line_app
    restart: always
    env_file:
      - src/assets/.env
    volumes:
      - ./docker_data/output:/app/src/assets/output
      - ./docker_data/templates:/app/src/assets/templates
      - ./docker_data/locales:/app/src/assets/locales
    ports:
      - "8081:8000"

  cloudflared:
#    image: cloudflare/cloudflared:latest
    image: cloudflare/cloudflared:2026.7.3
    container_name: h-line-cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE__TUNNEL_TOKEN}
    depends_on:
      - h-line
