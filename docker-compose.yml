name: h-line

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: flet_h-line:${APP_VERSION}
  pull_policy: missing
  restart: always
  env_file:
    - src/assets/.env
  volumes:
    - ./docker_data/output:/app/src/assets/output
    - ./src/assets/templates:/app/src/assets/templates
    - ./src/assets/locales:/app/src/assets/locales

services:
  h-line:
    <<: *app-base
    command: ["python", "src/main.py"]
    ports:
      - "8081:8000"

  h-line-web:
    <<: *app-base
    command: ["python", "src/main_web.py"]
    ports:
      - "8082:8000"

  cloudflared:
#    image: cloudflare/cloudflared:latest
    image: cloudflare/cloudflared:2026.10.3
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE__TUNNEL_TOKEN}
    depends_on:
      - h-line
      - h-line-web

  cloudflared-b9h:
    image: cloudflare/cloudflared:2026.10.3
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE__TUNNEL_TOKEN_B9H}
    depends_on:
      - h-line
      - h-line-web
