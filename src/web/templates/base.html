<!DOCTYPE html>
<html lang="{{ current_locale }}" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ fluent.get("app-title") }}</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/static/css/pico.min.css">
  <link rel="stylesheet" href="/static/css/custom.css">
  <script src="/static/js/htmx.min.js"></script>
</head>
<body class="container">
  <header>
    <nav>
      <ul>
        <li>
          <a href="/" class="header-brand">
            <img src="/images/logo-sies-317x312.png" alt="{{ fluent.get('sies') }}">
            <strong>H-Line</strong>
          </a>
        </li>
      </ul>
      <ul>
        <li>
          <button class="outline secondary"
                  hx-get="/about-modal"
                  hx-target="#modal-container"
                  hx-swap="innerHTML">
            {{ fluent.get("about-title") }}
          </button>
        </li>
        <li>
          <button class="outline secondary"
                  hx-get="/author-modal"
                  hx-target="#modal-container"
                  hx-swap="innerHTML">
            {{ fluent.get("author-title") }}
          </button>
        </li>
        <li>
          <details class="dropdown" style="margin-bottom: 0;">
            <summary class="outline secondary" style="padding: 0.35rem 0.65rem; margin-bottom: 0; font-size: 0.85rem;">
              🌐 {{ current_locale.upper() }}
            </summary>
            <ul dir="rtl">
              {% for lang in available_locales %}
                <li><a href="/set-locale?locale={{ lang }}">{{ lang.upper() }}</a></li>
              {% endfor %}
            </ul>
          </details>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer style="margin-top: 3rem; text-align: center; border-top: 1px solid var(--pico-muted-border-color); padding-top: 1.5rem;">
    <p><small>&copy; 2026 <a href="https://www.bogdanovych.org/" target="_blank">{{ fluent.get("author-name") }}</a></small></p>
  </footer>

  <div id="modal-container"></div>
</body>
</html>
