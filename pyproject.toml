[project]
name = "h-line"
version = "1.1.6"
description = "Open-source hotline automation tool for processing citizen appeals in the Ukrainian public sector."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Andrii Bogdanovych", email = "a@bogdanovych.org" }
]
license = "EUPL-1.2"
keywords = [
    "python", "flet", "government-tech", "digital-transformation", "ukraine",
    "citizen-appeals", "open-source", "eupl-license", "automation"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Government",
    "Natural Language :: Ukrainian",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Office/Business",
    "Topic :: Communications :: Email",
]
dependencies = [
    "flet==0.85.3",
    "flet-storage==1.1.3",
    "pydantic-settings==2.14.2",
    "pydantic[email]==2.13.4",
    "docxtpl==0.20.2",
    "pydantic-extra-types==2.11.2",
    "phonenumbers==9.0.33",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "fluent-manager==1.0.2",
    "measurement-api==0.2.0",
]

[dependency-groups]
dev = [
    "flet-cli",
    "flet-web",
    "flet-desktop",
    "pre_commit",
    "ruff",
    "pytest",
]

[tool.flet]
org = "ua.gov.sies"
product = "H-Line"
company = "Personal"
copyright = "Copyright (c) 2026 Andrii Bogdanovych"

[tool.flet.app]
path = "src"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project.urls]
"Homepage" = "https://www.bogdanovych.org"
"Repository" = "https://github.com/BogdanovychA/h-line"
"DOI" = "https://doi.org/10.5281/zenodo.19590690"
"Bug Tracker" = "https://github.com/BogdanovychA/h-line/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "preserve"
